services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    env_file: .env
  web:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: opspilot, POSTGRES_USER: opspilot, POSTGRES_PASSWORD: opspilot}
    ports: ["5432:5432"]
